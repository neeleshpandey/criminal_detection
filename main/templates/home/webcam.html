{% extends "layout/base.html" %}
{% block main_content %}
    {% load static %}
    <div class="main-content-inner">
        <div class="row">
            <div class="col-12 mt-5">
                <div class="card">
                    <div class="card-body">
                        <h4 class="header-title">Face Detection with Webcam</h4>
                        {% if messages %}
                            <div class="span12">
                                {% for message in messages %}
                                    <div class="alert alert-{{ message.tags }}">
                                        {{ message|safe }}
                                    </div>
                                {% endfor %}
                            </div>
                        {% endif %}
                        <div class="text-center">
                            <video id="webcam" autoplay playsinline style="width: 640px; height: 480px;"></video>
                            <canvas id="canvas" style="display: none;"></canvas>
                            <div class="mt-3">
                                <button id="startButton" class="btn btn-primary">Start Detection</button>
                                <button id="stopButton" class="btn btn-danger" style="display: none;">Stop Detection</button>
                            </div>
                            <div id="errorMessage" class="alert alert-danger mt-3" style="display: none;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block js_content %}
    <script src="{% static 'assets/js/vendor/jquery-2.2.4.min.js' %}"></script>
    <script>
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('canvas');
        let startButton = document.getElementById('startButton');
        let stopButton = document.getElementById('stopButton');
        let errorMessage = document.getElementById('errorMessage');
        let stream = null;
        let isProcessing = false;

        // Check if browser supports getUserMedia
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showError('Your browser does not support webcam access. Please try a modern browser like Chrome or Firefox.');
            startButton.disabled = true;
        }

        startButton.addEventListener('click', async () => {
            try {
                // First check if we already have a stream
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                // Request webcam access with specific constraints
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    }
                });
                
                video.srcObject = stream;
                startButton.style.display = 'none';
                stopButton.style.display = 'inline-block';
                errorMessage.style.display = 'none';
                isProcessing = true;
                
                // Wait for video to be ready
                video.onloadedmetadata = () => {
                    video.play();
                    processFrame();
                };
            } catch (err) {
                console.error('Error accessing webcam:', err);
                let errorText = 'Error accessing webcam. ';
                if (err.name === 'NotAllowedError') {
                    errorText += 'Please allow webcam access in your browser settings.';
                } else if (err.name === 'NotFoundError') {
                    errorText += 'No webcam found. Please make sure your webcam is connected.';
                } else if (err.name === 'NotReadableError') {
                    errorText += 'Your webcam is already in use by another application.';
                } else {
                    errorText += err.message;
                }
                showError(errorText);
            }
        });

        stopButton.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                startButton.style.display = 'inline-block';
                stopButton.style.display = 'none';
                isProcessing = false;
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            console.error(message);
        }

        async function processFrame() {
            if (!isProcessing) return;

            try {
                // Draw the current video frame to the canvas
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);

                // Get the frame data as base64
                const frameData = canvas.toDataURL('image/jpeg');

                // Send the frame to the server for processing
                const response = await fetch('/process_frame', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: `frame_data=${encodeURIComponent(frameData)}`
                });

                const data = await response.json();
                if (data.success) {
                    // Create an image from the processed frame
                    const img = new Image();
                    img.onload = () => {
                        // Draw the processed frame on the canvas
                        canvas.getContext('2d').drawImage(img, 0, 0);
                    };
                    img.src = `data:image/jpeg;base64,${data.processed_frame}`;
                } else {
                    console.error('Server processing error:', data.error);
                }
            } catch (err) {
                console.error('Error processing frame:', err);
                showError('Error processing video frame: ' + err.message);
            }

            // Schedule the next frame processing
            if (isProcessing) {
                requestAnimationFrame(processFrame);
            }
        }

        // Helper function to get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
{% endblock %}
